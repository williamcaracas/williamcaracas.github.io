<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DólarVZ — Tasas en tiempo real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0c0c0c;
      --bg2:      #161616;
      --bg3:      #1f1f1f;
      --bg4:      #282828;
      --border:   rgba(255,255,255,0.06);
      --border2:  rgba(255,255,255,0.12);
      --text:     #ededed;
      --text2:    #777;
      --text3:    #444;
      --green:    #1fba88;
      --green-d:  rgba(31,186,136,0.12);
      --blue:     #4a9eff;
      --blue-d:   rgba(74,158,255,0.12);
      --purple:   #9b87f5;
      --purple-d: rgba(155,135,245,0.12);
      --amber:    #f5a623;
      --amber-d:  rgba(245,166,35,0.12);
      --red:      #ff5e57;
      --red-d:    rgba(255,94,87,0.10);
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Sora', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }
    .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* HEADER */
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; }
    .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--green-d); border: 0.5px solid rgba(31,186,136,0.3); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--green); flex-shrink: 0; }
    .header-info { flex: 1; }
    .app-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .app-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .live-pill { display: flex; align-items: center; gap: 6px; background: var(--green-d); border: 0.5px solid rgba(31,186,136,0.2); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--green); font-family: var(--mono); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .live-pill.loading .live-dot { background: var(--amber); animation: none; }
    .refresh-btn { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-family: var(--sans); color: var(--text2); cursor: pointer; transition: all 0.2s; }
    .refresh-btn:hover { color: var(--text); background: var(--bg4); }

    /* CARDS */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
    .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.1rem 1.2rem 1rem; position: relative; overflow: hidden; transition: border-color 0.2s; }
    .card:hover { border-color: var(--border2); }
    .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 16px 16px 0 0; }
    .card.accent-blue::after   { background: var(--blue); }
    .card.accent-purple::after { background: var(--purple); }
    .card.accent-green::after  { background: var(--green); }
    .card.accent-amber::after  { background: var(--amber); }
    .card-icon { font-size: 11px; font-family: var(--mono); color: var(--text3); margin-bottom: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .card-value { font-size: 24px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.03em; line-height: 1; color: var(--text); }
    .card-unit { font-size: 13px; color: var(--text2); font-weight: 400; margin-left: 3px; }
    .card-change { font-size: 12px; margin-top: 8px; font-family: var(--mono); }
    .card-badge { display: inline-block; font-size: 10px; padding: 3px 9px; border-radius: 20px; margin-top: 10px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
    .badge-blue   { background: var(--blue-d);   color: var(--blue);   border: 0.5px solid rgba(74,158,255,0.2); }
    .badge-purple { background: var(--purple-d); color: var(--purple); border: 0.5px solid rgba(155,135,245,0.2); }
    .badge-amber  { background: var(--amber-d);  color: var(--amber);  border: 0.5px solid rgba(245,166,35,0.2); }
    .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--text2); }

    /* SPREAD */
    .spread-row { display: flex; gap: 10px; margin-bottom: 1.25rem; }
    .spread-card { flex: 1; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .spread-label { font-size: 12px; color: var(--text2); }
    .spread-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
    .spread-pct { font-size: 28px; font-weight: 600; font-family: var(--mono); color: var(--amber); letter-spacing: -0.03em; }
    .spread-diff { font-size: 12px; color: var(--text2); margin-top: 2px; text-align: right; font-family: var(--mono); }

    /* SECTIONS */
    .section { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; }
    .section-title { font-size: 11px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.1rem; font-family: var(--mono); }

    /* CALC */
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    @media (max-width: 500px) { .calc-grid { grid-template-columns: 1fr 1fr; } }
    .calc-grid input, .calc-grid select { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: var(--sans); color: var(--text); outline: none; width: 100%; transition: border-color 0.2s; }
    .calc-grid input:focus, .calc-grid select:focus { border-color: var(--blue); }
    .calc-grid select option { background: #1f1f1f; }
    .calc-result { background: var(--bg3); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .calc-result-label { font-size: 12px; color: var(--text2); }
    .calc-result-val { font-size: 24px; font-weight: 600; font-family: var(--mono); color: var(--text); letter-spacing: -0.02em; }

    /* BARS */
    .bars { display: flex; flex-direction: column; gap: 14px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { font-size: 12px; color: var(--text2); min-width: 90px; font-family: var(--mono); }
    .bar-track { flex: 1; background: var(--bg3); border-radius: 6px; height: 8px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
    .bar-val { font-size: 13px; color: var(--text); min-width: 100px; text-align: right; font-family: var(--mono); }

    /* TABLE */
    .rates-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rates-table th { color: var(--text3); font-weight: 400; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); }
    .rates-table th:last-child, .rates-table td:last-child { text-align: right; }
    .rates-table td { padding: 12px 0; border-bottom: 0.5px solid var(--border); color: var(--text); }
    .rates-table tr:last-child td { border-bottom: none; }
    .rates-table .src { font-size: 11px; color: var(--text3); font-family: var(--mono); }

    /* FOOTER */
    .footer { text-align: center; margin-top: 2.5rem; font-size: 11px; color: var(--text3); font-family: var(--mono); }
    /* LOADER */
    .loader { text-align: center; padding: 3rem; color: var(--text2); font-size: 14px; }
    .loader span { display: inline-block; animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .demo-badge { display: inline-block; font-size: 10px; background: var(--amber-d); color: var(--amber); border: 0.5px solid rgba(245,166,35,0.2); border-radius: 20px; padding: 2px 8px; margin-left: 6px; font-family: var(--mono); }

    /* NEW CALCULATOR */
    .calc-section { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .calc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .calc-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--green-d); border: 0.5px solid rgba(31,186,136,0.3); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .calc-title { font-size: 15px; font-weight: 600; }
    .calc-rates-mini { font-size: 11px; color: var(--text2); font-family: var(--mono); margin-top: 2px; }
    .calc-tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 12px; padding: 4px; margin-bottom: 1.25rem; }
    .calc-tab { flex: 1; padding: 8px 0; border-radius: 10px; border: none; background: transparent; color: var(--text2); font-size: 13px; font-family: var(--sans); font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .calc-tab.active { background: var(--bg2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .calc-tab .tab-symbol { font-size: 11px; opacity: 0.6; font-family: var(--mono); }
    .calc-input-group { position: relative; margin-bottom: 8px; }
    .calc-input-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); margin-bottom: 6px; }
    .calc-input-box { display: flex; align-items: center; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 14px; padding: 4px; transition: border-color 0.2s; }
    .calc-input-box:focus-within { border-color: var(--blue); }
    .calc-input-box .currency-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; font-family: var(--mono); flex-shrink: 0; margin-left: 4px; }
    .calc-input-box input { flex: 1; background: transparent; border: none; outline: none; font-size: 26px; font-weight: 600; font-family: var(--mono); color: var(--text); padding: 8px 12px; letter-spacing: -0.02em; }
    .calc-input-box input::placeholder { color: var(--text3); }
    .calc-input-box .currency-label { font-size: 14px; color: var(--text2); font-weight: 500; padding-right: 14px; }
    .calc-swap-btn { display: flex; align-items: center; justify-content: center; margin: -4px auto; position: relative; z-index: 2; width: 40px; height: 40px; border-radius: 50%; background: var(--green); border: 3px solid var(--bg2); color: #fff; font-size: 18px; cursor: pointer; transition: all 0.25s; }
    .calc-swap-btn:hover { transform: rotate(180deg); background: #25d9a0; }
    .calc-result-box { background: var(--bg3); border: 0.5px solid var(--border); border-radius: 14px; padding: 4px; }
    .calc-result-box .currency-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; margin-left: 4px; }
    .calc-result-box .result-value { flex: 1; font-size: 26px; font-weight: 600; font-family: var(--mono); color: var(--text); padding: 8px 12px; letter-spacing: -0.02em; }
    .calc-result-box .currency-label { font-size: 14px; color: var(--text2); font-weight: 500; padding-right: 14px; }
    .calc-result-box { display: flex; align-items: center; }
    .calc-p2p-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .calc-p2p-row .p2p-icon { font-size: 11px; color: var(--amber); font-family: var(--mono); font-weight: 500; }
    .calc-p2p-row .p2p-label { font-size: 11px; color: var(--text2); flex: 1; }
    .calc-p2p-row .p2p-value { font-size: 18px; font-weight: 600; font-family: var(--mono); color: var(--text); }
    .calc-p2p-row .p2p-diff { font-size: 10px; color: var(--green); margin-left: 8px; background: var(--green-d); padding: 2px 8px; border-radius: 20px; font-family: var(--mono); }
    .calc-bottom-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .calc-bottom-card { background: var(--bg3); border-radius: 12px; padding: 12px 14px; border-left: 2px solid; }
    .calc-bottom-card .cbc-label { font-size: 10px; color: var(--text2); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .calc-bottom-card .cbc-value { font-size: 20px; font-weight: 600; font-family: var(--mono); color: var(--text); }

    /* CHART */
    .chart-section { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .chart-title-row { display: flex; align-items: center; gap: 10px; }
    .chart-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--purple-d); border: 0.5px solid rgba(155,135,245,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .chart-title { font-size: 15px; font-weight: 600; }
    .chart-subtitle { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .chart-period-btns { display: flex; gap: 2px; background: var(--bg3); border-radius: 10px; padding: 3px; }
    .chart-period-btn { padding: 5px 12px; border-radius: 8px; border: none; background: transparent; color: var(--text2); font-size: 11px; font-family: var(--mono); font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .chart-period-btn.active { background: var(--bg2); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .chart-legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); font-family: var(--mono); }
    .chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .chart-canvas-wrap { position: relative; width: 100%; height: 280px; }
    .chart-canvas-wrap canvas { width: 100%; height: 100%; }
    .chart-tooltip { position: absolute; background: var(--bg4); border: 0.5px solid var(--border2); border-radius: 10px; padding: 8px 12px; font-size: 11px; font-family: var(--mono); color: var(--text); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 5; white-space: nowrap; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">Bs</div>
    <div class="header-info">
      <div class="app-title">DólarVZ</div>
      <div class="app-sub">Tasas en tiempo real · Venezuela</div>
    </div>
    <div class="header-right">
      <div class="live-pill loading" id="live-pill">
        <div class="live-dot"></div>
        <span id="update-time">Cargando</span>
      </div>
      <button class="refresh-btn" onclick="loadRates()">↺ Actualizar</button>
    </div>
  </div>

  <div id="main-content">
    <div class="loader">Consultando APIs<span>...</span></div>
  </div>


  <div id="chart-container"></div>

  <div class="footer">Datos: ve.dolarapi.com · Actualización automática cada 5 min</div>
</div>


<script>
const APIS={usd:'https://ve.dolarapi.com/v1/dolares',eur:'https://ve.dolarapi.com/v1/euros',hist:'https://ve.dolarapi.com/v1/historicos/dolares',histEur:'https://ve.dolarapi.com/v1/historicos/euros',backup:'https://pydolarve.org/api/v2/dollar?monitor=all'};
let ratesData=null,calcReversed=false,calcCurrency='usd',historicData=null;
async function tryFetch(u){const r=await fetch(u,{signal:AbortSignal.timeout(7000)});if(!r.ok)throw new Error('bad');return r.json();}
const safeNum=v=>{if(v==null)return 0;const p=parseFloat(v);return isNaN(p)?0:p;};
function parseVeDolar(usd,eur){
  const gT=d=>((d.nombre||'')+' '+(d.fuente||'')+' '+(d.slug||'')+' '+(d.title||'')+' '+(d.moneda||'')).toLowerCase();
  const fi=(data,keys)=>data.find(d=>keys.some(k=>gT(d).includes(k)));
  let bu=fi(usd,['bcv','oficial'])||usd.find(d=>d.moneda==='USD'&&d.fuente==='oficial')||usd.find(d=>d.moneda==='USD');
  let bn=fi(usd,['paralelo','binance','cripto','usdt'])||usd.find(d=>d.fuente==='paralelo');
  let be=fi(eur,['bcv','oficial'])||eur.find(d=>d.moneda==='EUR'&&d.fuente==='oficial')||eur.find(d=>d.moneda==='EUR');
  if(!bu)return null;
  const gv=o=>safeNum(o.promedio||o.precio||o.usd||o.venta||o.compra);
  return{bcvUsd:gv(bu),bcvEur:be?gv(be):550.89,binance:bn?gv(bn):null,bcvUsdChg:safeNum(bu.variacion||bu.change||bu.cambio),binanceChg:safeNum(bn?.variacion||bn?.change||bn?.cambio),eurChg:safeNum(be?.variacion||be?.change||be?.cambio)};
}
async function loadRates(){
  const pill=document.getElementById('live-pill'),timeEl=document.getElementById('update-time');
  pill.className='live-pill loading';timeEl.textContent='Actualizando';
  let parsed=null,src='';
  try{const[u,e]=await Promise.all([tryFetch(APIS.usd),tryFetch(APIS.eur)]);if(Array.isArray(u)&&Array.isArray(e)){parsed=parseVeDolar(u,e);src='ve.dolarapi.com';}}catch(e){}
  if(!parsed){try{const r=await tryFetch(APIS.backup);const a=r?.monitors?Object.values(r.monitors).map(v=>({...v,nombre:v.title||v.key||''})):null;if(a){parsed=parseVeDolar(a,[]);src='pydolarve.org';}}catch(e){}}
  const isDemo=!parsed;
  if(isDemo)parsed={bcvUsd:489.55,bcvEur:556.20,binance:638.00,bcvUsdChg:0.15,binanceChg:-0.42,eurChg:0.08};
  // Try to compute real changes from historic
  try{await loadHistoricAndComputeChanges(parsed);}catch(e){}
  ratesData=parsed;renderDashboard(parsed);
  pill.className='live-pill';timeEl.textContent=new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  const ot=pill.querySelector('.demo-badge');if(ot)ot.remove();
  if(isDemo){const t=document.createElement('span');t.className='demo-badge';t.textContent='demo';timeEl.after(t);}
  loadChart();
}
async function loadHistoricAndComputeChanges(d){
  try{
    const data=await tryFetch(APIS.hist);
    if(!Array.isArray(data)||data.length<2)return;
    historicData=data;
    const bcv=data.filter(x=>x.fuente==='oficial').sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    const par=data.filter(x=>x.fuente==='paralelo').sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(bcv.length>=2){const cur=safeNum(bcv[0].promedio||bcv[0].precio),prev=safeNum(bcv[1].promedio||bcv[1].precio);if(prev>0)d.bcvUsdChg=((cur-prev)/prev*100);}
    if(par.length>=2){const cur=safeNum(par[0].promedio||par[0].precio),prev=safeNum(par[1].promedio||par[1].precio);if(prev>0)d.binanceChg=((cur-prev)/prev*100);}
  }catch(e){console.log('Historic fetch failed',e);}
  try{
    const eData=await tryFetch(APIS.histEur);
    if(Array.isArray(eData)&&eData.length>=2){
      const bcvE=eData.filter(x=>x.fuente==='oficial').sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
      if(bcvE.length>=2){const cur=safeNum(bcvE[0].promedio||bcvE[0].precio),prev=safeNum(bcvE[1].promedio||bcvE[1].precio);if(prev>0)d.eurChg=((cur-prev)/prev*100);}
    }
  }catch(e){}
}
const fmt=(n,dec=2)=>n!=null?n.toLocaleString('es-VE',{minimumFractionDigits:dec,maximumFractionDigits:4}):'—';
const cls=v=>v>0.001?'up':v<-0.001?'down':'flat';
const arrow=v=>v>0.001?'▲ ':v<-0.001?'▼ ':'';

function renderDashboard(d){
  const spread=d.binance?((d.binance-d.bcvUsd)/d.bcvUsd*100):null;
  const spreadDif=d.binance?(d.binance-d.bcvUsd):null;
  const avg=d.binance?(d.bcvUsd*0.5+d.binance*0.5):d.bcvUsd;
  const maxRate=Math.max(d.bcvUsd,d.bcvEur||0,d.binance||0,avg);
  document.getElementById('main-content').innerHTML=`
    <div class="cards-grid">
      <div class="card accent-blue"><div class="card-icon">USD · BCV</div><div class="card-value">${fmt(d.bcvUsd)}<span class="card-unit">Bs</span></div><div class="card-change ${cls(d.bcvUsdChg)}">${arrow(d.bcvUsdChg)}${Math.abs(d.bcvUsdChg).toFixed(2)}%</div><span class="card-badge badge-blue">Oficial</span></div>
      <div class="card accent-purple"><div class="card-icon">EUR · BCV</div><div class="card-value">${fmt(d.bcvEur)}<span class="card-unit">Bs</span></div><div class="card-change ${cls(d.eurChg)}">${arrow(d.eurChg)}${Math.abs(d.eurChg).toFixed(2)}%</div><span class="card-badge badge-purple">Oficial</span></div>
      ${d.binance?`<div class="card accent-green"><div class="card-icon">USDT · Paralelo</div><div class="card-value">${fmt(d.binance)}<span class="card-unit">Bs</span></div><div class="card-change ${cls(d.binanceChg)}">${arrow(d.binanceChg)}${Math.abs(d.binanceChg).toFixed(2)}%</div><span class="card-badge badge-amber">Paralelo</span></div>`:``}
      <div class="card accent-amber"><div class="card-icon">Promedio</div><div class="card-value">${fmt(avg)}<span class="card-unit">Bs</span></div><div class="card-change flat">ponderado</div><span class="card-badge badge-amber">Mixto</span></div>
    </div>
    ${spread!=null?`<div class="spread-row"><div class="spread-card"><div><div class="spread-label">Brecha BCV vs Paralelo</div><div class="spread-sub">paralelo sobre tasa oficial</div></div><div style="text-align:right"><div class="spread-pct">+${spread.toFixed(2)}%</div><div class="spread-diff">Dif: ${fmt(spreadDif)} Bs</div></div></div></div>`:``}
    <div class="calc-section" id="calc-section">
      <div class="calc-header"><div class="calc-icon">💱</div><div><div class="calc-title">Calculadora</div><div class="calc-rates-mini">🏛 BCV: ${fmt(d.bcvUsd)} · ₿ P2P: ${d.binance?fmt(d.binance):'—'}</div></div></div>
      <div class="calc-tabs">
        <button class="calc-tab active" onclick="setCalcCurrency('usd',this)"><span class="tab-symbol">$</span> USD</button>
        <button class="calc-tab" onclick="setCalcCurrency('eur',this)"><span class="tab-symbol">€</span> EUR</button>
        ${d.binance?`<button class="calc-tab" onclick="setCalcCurrency('usdt',this)"><span class="tab-symbol">₿</span> USDT</button>`:``}
      </div>
      <div class="calc-input-label" id="calc-from-label">DÓLARES (USD)</div>
      <div class="calc-input-group">
        <div class="calc-input-box"><div class="currency-icon" id="calc-from-icon" style="background:var(--blue-d);color:var(--blue);">$</div><input type="number" id="calc-amount" value="1" min="0" step="any" oninput="recalc()" placeholder="0"/><span class="currency-label" id="calc-from-unit">USD</span></div>
      </div>
      <button class="calc-swap-btn" onclick="swapCalc()">⇅</button>
      <div class="calc-input-label">BOLÍVARES (BS) — TASA BCV</div>
      <div class="calc-result-box"><div class="currency-icon" style="background:var(--green-d);color:var(--green);">Bs</div><div class="result-value" id="calc-output">${fmt(d.bcvUsd)}</div><span class="currency-label">Bs</span></div>
      ${d.binance?`<div class="calc-p2p-row"><span class="p2p-icon">₿</span><span class="p2p-label" id="p2p-label">1,00 $ EN P2P</span><span class="p2p-value" id="p2p-value">${fmt(d.binance)}</span><span class="p2p-diff" id="p2p-diff">+${fmt(spreadDif)} Bs</span></div>`:``}
      <div class="calc-bottom-cards">
        <div class="calc-bottom-card" style="border-color:var(--blue);"><div class="cbc-label">🏛 BCV ${calcCurrency.toUpperCase()}</div><div class="cbc-value" id="cbc-bcv">${fmt(d.bcvUsd)} <span style="font-size:12px;color:var(--text2)">Bs</span></div></div>
        <div class="calc-bottom-card" style="border-color:var(--amber);"><div class="cbc-label">₿ P2P USDT</div><div class="cbc-value" id="cbc-p2p">${d.binance?fmt(d.binance):'—'} <span style="font-size:12px;color:var(--text2)">Bs</span></div></div>
      </div>
    </div>
    <div class="section"><div class="section-title">Comparativa de tasas</div><div class="bars">
      <div class="bar-row"><span class="bar-label">BCV USD</span><div class="bar-track"><div class="bar-fill" style="width:${(d.bcvUsd/maxRate*100).toFixed(1)}%;background:var(--blue);"></div></div><span class="bar-val">${fmt(d.bcvUsd)} Bs</span></div>
      <div class="bar-row"><span class="bar-label">BCV EUR</span><div class="bar-track"><div class="bar-fill" style="width:${(d.bcvEur/maxRate*100).toFixed(1)}%;background:var(--purple);"></div></div><span class="bar-val">${fmt(d.bcvEur)} Bs</span></div>
      ${d.binance?`<div class="bar-row"><span class="bar-label">Paralelo</span><div class="bar-track"><div class="bar-fill" style="width:${(d.binance/maxRate*100).toFixed(1)}%;background:var(--green);"></div></div><span class="bar-val">${fmt(d.binance)} Bs</span></div>`:``}
      <div class="bar-row"><span class="bar-label">Promedio</span><div class="bar-track"><div class="bar-fill" style="width:${(avg/maxRate*100).toFixed(1)}%;background:var(--amber);"></div></div><span class="bar-val">${fmt(avg)} Bs</span></div>
    </div></div>`;
  window._rd=d;recalc();
}

function setCalcCurrency(c,btn){
  calcCurrency=c;calcReversed=false;
  document.querySelectorAll('.calc-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const labels={usd:['DÓLARES (USD)','$','USD','var(--blue-d)','var(--blue)'],eur:['EUROS (EUR)','€','EUR','var(--purple-d)','var(--purple)'],usdt:['USDT (TETHER)','₿','USDT','var(--amber-d)','var(--amber)']};
  const l=labels[c];
  document.getElementById('calc-from-label').textContent=l[0];
  document.getElementById('calc-from-icon').textContent=l[1];
  document.getElementById('calc-from-icon').style.background=l[3];
  document.getElementById('calc-from-icon').style.color=l[4];
  document.getElementById('calc-from-unit').textContent=l[2];
  recalc();
}
function swapCalc(){calcReversed=!calcReversed;const btn=document.querySelector('.calc-swap-btn');btn.style.transform=calcReversed?'rotate(180deg)':'';recalc();}
function recalc(){
  const d=window._rd;if(!d)return;
  const amount=parseFloat(document.getElementById('calc-amount')?.value)||0;
  let rate=calcCurrency==='eur'?d.bcvEur:calcCurrency==='usdt'?(d.binance||d.bcvUsd):d.bcvUsd;
  let result,fromLabel,toLabel;
  if(!calcReversed){result=amount*rate;fromLabel=amount.toLocaleString('es-VE');toLabel='Bs';}
  else{result=amount/rate;toLabel=calcCurrency.toUpperCase();}
  const outEl=document.getElementById('calc-output');
  if(outEl)outEl.textContent=result.toLocaleString('es-VE',{minimumFractionDigits:calcReversed?4:2,maximumFractionDigits:calcReversed?4:2});
  // P2P row
  const p2pVal=document.getElementById('p2p-value'),p2pLabel=document.getElementById('p2p-label'),p2pDiff=document.getElementById('p2p-diff');
  if(p2pVal&&d.binance){
    const p2pRate=d.binance;
    if(!calcReversed){
      const p2pRes=amount*p2pRate;p2pVal.textContent=fmt(p2pRes);
      p2pLabel.textContent=`${amount.toLocaleString('es-VE',{maximumFractionDigits:2})} $ EN P2P`;
      const diff=p2pRes-result;p2pDiff.textContent=`+${fmt(diff)} Bs`;
    }else{
      const p2pRes=amount/p2pRate;p2pVal.textContent=p2pRes.toFixed(4);
      p2pLabel.textContent=`${amount.toLocaleString('es-VE',{maximumFractionDigits:2})} Bs EN P2P`;
      const diff=result-p2pRes;p2pDiff.textContent=`+${diff.toFixed(4)} $`;
    }
  }
  // Bottom cards
  const cbcBcv=document.getElementById('cbc-bcv'),cbcP2p=document.getElementById('cbc-p2p');
  if(cbcBcv){
    const bcvR=calcCurrency==='eur'?d.bcvEur:d.bcvUsd;
    if(!calcReversed)cbcBcv.innerHTML=`${fmt(amount*bcvR)} <span style="font-size:12px;color:var(--text2)">Bs</span>`;
    else cbcBcv.innerHTML=`${(amount/bcvR).toFixed(4)} <span style="font-size:12px;color:var(--text2)">${calcCurrency.toUpperCase()}</span>`;
  }
  if(cbcP2p&&d.binance){
    if(!calcReversed)cbcP2p.innerHTML=`${fmt(amount*d.binance)} <span style="font-size:12px;color:var(--text2)">Bs</span>`;
    else cbcP2p.innerHTML=`${(amount/d.binance).toFixed(4)} <span style="font-size:12px;color:var(--text2)">USDT</span>`;
  }
}
loadRates();setInterval(loadRates,5*60*1000);

/* ════════ CHART ════════ */
let chartPeriod=30;
async function loadChart(){
  const container=document.getElementById('chart-container');if(!container)return;
  container.innerHTML=`<div class="chart-section"><div class="chart-header"><div class="chart-title-row"><div class="chart-icon">📈</div><div><div class="chart-title">Evolución de Tasas</div><div class="chart-subtitle">Histórico de cotizaciones en el tiempo</div></div></div><div class="chart-period-btns"><button class="chart-period-btn ${chartPeriod===7?'active':''}" onclick="setChartPeriod(7)">7D</button><button class="chart-period-btn ${chartPeriod===30?'active':''}" onclick="setChartPeriod(30)">30D</button><button class="chart-period-btn ${chartPeriod===90?'active':''}" onclick="setChartPeriod(90)">3M</button></div></div><div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--blue)"></div>BCV USD</div><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--purple)"></div>BCV EUR</div><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--amber)"></div>PARALELO</div></div><div class="chart-canvas-wrap"><canvas id="rates-chart"></canvas><div class="chart-tooltip" id="chart-tooltip"></div></div></div>`;
  try{
    let allData=historicData;
    if(!allData){allData=await tryFetch(APIS.hist);historicData=allData;}
    if(!Array.isArray(allData)||allData.length===0)return;
    let eurData=[];try{eurData=await tryFetch(APIS.histEur);}catch(e){}
    drawChart(allData,eurData);
  }catch(e){console.error('Chart error:',e);}
}
function setChartPeriod(p){chartPeriod=p;loadChart();}
function drawChart(data,eurData){
  const canvas=document.getElementById('rates-chart');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;
  const pad={t:20,r:20,b:40,l:55};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  // Process data
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-chartPeriod);
  const bcvArr=data.filter(d=>d.fuente==='oficial'&&new Date(d.fecha)>=cutoff).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(d=>({date:new Date(d.fecha),val:safeNum(d.promedio||d.precio)}));
  const parArr=data.filter(d=>d.fuente==='paralelo'&&new Date(d.fecha)>=cutoff).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(d=>({date:new Date(d.fecha),val:safeNum(d.promedio||d.precio)}));
  const eurArr=(Array.isArray(eurData)?eurData:[]).filter(d=>d.fuente==='oficial'&&new Date(d.fecha)>=cutoff).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(d=>({date:new Date(d.fecha),val:safeNum(d.promedio||d.precio)}));
  const allPts=[...bcvArr,...parArr,...eurArr];
  if(allPts.length===0)return;
  const minDate=Math.min(...allPts.map(p=>p.date.getTime()));
  const maxDate=Math.max(...allPts.map(p=>p.date.getTime()));
  const allVals=allPts.map(p=>p.val).filter(v=>v>0);
  let minVal=Math.min(...allVals)*0.98,maxVal=Math.max(...allVals)*1.02;
  if(maxVal-minVal<10){minVal-=10;maxVal+=10;}
  const xScale=v=>pad.l+(maxDate===minDate?cw/2:((v-minDate)/(maxDate-minDate))*cw);
  const yScale=v=>pad.t+ch-(((v-minVal)/(maxVal-minVal))*ch);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  const ySteps=5;for(let i=0;i<=ySteps;i++){const y=pad.t+(ch/ySteps)*i;const val=maxVal-((maxVal-minVal)/ySteps)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='#555';ctx.font='10px JetBrains Mono';ctx.textAlign='right';ctx.fillText(val.toFixed(0),pad.l-8,y+4);}
  // X labels
  const dates=bcvArr.length>0?bcvArr:parArr;
  const step=Math.max(1,Math.floor(dates.length/5));
  ctx.fillStyle='#555';ctx.font='10px JetBrains Mono';ctx.textAlign='center';
  for(let i=0;i<dates.length;i+=step){const x=xScale(dates[i].date.getTime());const label=dates[i].date.toLocaleDateString('es-VE',{day:'numeric',month:'short'});ctx.fillText(label,x,H-pad.b+20);}
  // Draw lines
  function drawLine(arr,color,width){
    if(arr.length<2)return;ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';
    arr.forEach((p,i)=>{const x=xScale(p.date.getTime()),y=yScale(p.val);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
    // Gradient fill
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);const c=color;grad.addColorStop(0,c.replace(')',',0.15)').replace('rgb','rgba'));grad.addColorStop(1,c.replace(')',',0)').replace('rgb','rgba'));
    ctx.fillStyle=grad;ctx.lineTo(xScale(arr[arr.length-1].date.getTime()),pad.t+ch);ctx.lineTo(xScale(arr[0].date.getTime()),pad.t+ch);ctx.closePath();ctx.fill();
  }
  drawLine(bcvArr,'rgb(74,158,255)',2.5);
  drawLine(eurArr,'rgb(155,135,245)',2);
  drawLine(parArr,'rgb(245,166,35)',2);
  // Tooltip on hover
  canvas.onmousemove=function(e){
    const r=canvas.getBoundingClientRect();const mx=e.clientX-r.left;
    const tooltip=document.getElementById('chart-tooltip');if(!tooltip)return;
    const dateAtX=minDate+((mx-pad.l)/cw)*(maxDate-minDate);
    const findNearest=(arr)=>{if(!arr.length)return null;let best=arr[0];arr.forEach(p=>{if(Math.abs(p.date.getTime()-dateAtX)<Math.abs(best.date.getTime()-dateAtX))best=p;});return best;};
    const nb=findNearest(bcvArr),ne=findNearest(eurArr),np=findNearest(parArr);
    const d=nb||ne||np;if(!d)return;
    const dateStr=d.date.toLocaleDateString('es-VE',{day:'numeric',month:'short',year:'numeric'});
    let html=`<strong>${dateStr}</strong><br>`;
    if(nb)html+=`<span style="color:#4a9eff">BCV: ${nb.val.toFixed(2)}</span><br>`;
    if(ne)html+=`<span style="color:#9b87f5">EUR: ${ne.val.toFixed(2)}</span><br>`;
    if(np)html+=`<span style="color:#f5a623">P2P: ${np.val.toFixed(2)}</span>`;
    tooltip.innerHTML=html;tooltip.style.opacity='1';
    tooltip.style.left=Math.min(mx+10,W-140)+'px';tooltip.style.top='10px';
  };
  canvas.onmouseleave=function(){const t=document.getElementById('chart-tooltip');if(t)t.style.opacity='0';};
}
</script>
