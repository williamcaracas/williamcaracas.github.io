name: Tasa BCV

on:
  schedule:
    - cron: "*/30 * * * 1-5"   # cada 30 min, lunes a viernes (hora UTC)
  workflow_dispatch:            # botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/bcv.py
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/bcv.json
          git diff --cached --quiet || (git commit -m "Tasa BCV $(date -u +%F)" && git push)
